<svg width="900" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .box { fill: #e8f4f8; stroke: #0066cc; stroke-width: 2; }
      .title { font-size: 16px; font-weight: bold; fill: #0066cc; }
      .label { font-size: 14px; fill: #333; }
      .arrow { stroke: #666; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666" />
    </marker>
  </defs>

  <text x="450" y="30" class="title" text-anchor="middle" font-size="20">RISC-V + Systolic Array SoC Architecture</text>

  <rect x="50" y="80" width="200" height="120" class="box" rx="8"/>
  <text x="150" y="110" class="label" text-anchor="middle" font-weight="bold">PicoRV32</text>
  <text x="150" y="135" class="label" text-anchor="middle" font-size="12">RISC-V Softcore</text>
  <text x="150" y="160" class="label" text-anchor="middle" font-size="11">Runs firmware</text>
  <text x="150" y="180" class="label" text-anchor="middle" font-size="11">(C code)</text>

  <rect x="650" y="80" width="200" height="120" class="box" rx="8"/>
  <text x="750" y="110" class="label" text-anchor="middle" font-weight="bold">4×4 Systolic Array</text>
  <text x="750" y="135" class="label" text-anchor="middle" font-size="12">INT8 Accelerator</text>
  <text x="750" y="160" class="label" text-anchor="middle" font-size="11">Matrix Multiply</text>
  <text x="750" y="180" class="label" text-anchor="middle" font-size="11">1 result/cycle</text>

  <rect x="150" y="280" width="600" height="60" class="box" rx="8"/>
  <text x="450" y="315" class="label" text-anchor="middle" font-weight="bold">Memory-Mapped Bus (32-bit)</text>

  <line x1="150" y1="200" x2="150" y2="250" class="arrow"/>
  <line x1="150" y1="250" x2="300" y2="250" class="arrow"/>
  <line x1="300" y1="250" x2="300" y2="280" class="arrow"/>

  <line x1="750" y1="200" x2="750" y2="250" class="arrow"/>
  <line x1="750" y1="250" x2="600" y2="250" class="arrow"/>
  <line x1="600" y1="250" x2="600" y2="280" class="arrow"/>

  <rect x="50" y="420" width="160" height="100" class="box" rx="8"/>
  <text x="130" y="450" class="label" text-anchor="middle" font-weight="bold">Simulated</text>
  <text x="130" y="475" class="label" text-anchor="middle" font-weight="bold">RAM</text>
  <text x="130" y="500" class="label" text-anchor="middle" font-size="11">(matrices A, B)</text>

  <rect x="280" y="420" width="160" height="100" class="box" rx="8"/>
  <text x="360" y="450" class="label" text-anchor="middle" font-weight="bold">UART</text>
  <text x="360" y="475" class="label" text-anchor="middle">Serial I/O</text>
  <text x="360" y="500" class="label" text-anchor="middle" font-size="11">to PC</text>

  <rect x="510" y="420" width="160" height="100" class="box" rx="8"/>
  <text x="590" y="450" class="label" text-anchor="middle" font-weight="bold">Cycle</text>
  <text x="590" y="475" class="label" text-anchor="middle" font-weight="bold">Counter</text>
  <text x="590" y="500" class="label" text-anchor="middle" font-size="11">Timing</text>

  <rect x="740" y="420" width="140" height="100" class="box" rx="8"/>
  <text x="810" y="450" class="label" text-anchor="middle" font-weight="bold">Result</text>
  <text x="810" y="475" class="label" text-anchor="middle">Matrix C</text>
  <text x="810" y="500" class="label" text-anchor="middle" font-size="11">(4×4)</text>

  <line x1="300" y1="340" x2="130" y2="380" class="arrow"/>
  <line x1="360" y1="340" x2="360" y2="420" class="arrow"/>
  <line x1="450" y1="340" x2="590" y2="420" class="arrow"/>
  <line x1="600" y1="340" x2="810" y2="420" class="arrow"/>

  <text x="50" y="570" class="label" font-weight="bold">Flow:</text>
  <text x="150" y="570" class="label">CPU loads matrices → triggers accelerator → reads results → measures cycles</text>
</svg>
